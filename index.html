  /* ══════ 主题：明亮＝档案馆　暗色＝观测台 ══════ */
  :root, :root[data-theme="light"] {

    --t-graft:   #6cb6ff;
    --t-rights:  #8fbc6a;
    --halo-op:   .34;
    --dot-glow:  0 0 10px var(--c), 0 0 22px color-mix(in srgb, var(--c) 55%, transparent);

    --glass:     rgba(16,18,22,.86);
    --amb-1:     rgba(60,90,140,.15);
    --amb-2:     rgba(120,70,130,.11);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;

                radial-gradient(820px 520px at 82% 64%, var(--amb-2), transparent 64%); }
  :root { --serif: "Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
          --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }

  /* 画布上的文字禁止选中：否则点击标题会变成「划词选中」，导致被判为拖拽而不展开卡片。
     卡片内部单独恢复可选，以便复制引文与来源。 */
  #stage, #layer, #bar, #mini, #ruler, #hint { user-select:none; -webkit-user-select:none; }

  /* ══════ 刻度 ══════ */
  .tk { position:absolute; width:1px; background: linear-gradient(to bottom, transparent, var(--hair) 20%, var(--hair) 80%, transparent); }
  .tk.era { background: linear-gradient(to bottom, transparent, var(--line) 16%, var(--line) 84%, transparent); }

  /* ══════ 光点 ══════ */

    animation:breathe var(--dur) ease-in-out infinite alternate; animation-delay:var(--delay); }
  @keyframes breathe { from{transform:translate(-50%,-50%) scale(.85)} to{transform:translate(-50%,-50%) scale(1.15)} }
  .dot { position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%);
    background:var(--c); box-shadow:var(--dot-glow); pointer-events:none;
    transition:transform .34s cubic-bezier(.22,.9,.28,1); }
  /* 透明热区：光点本身太小，点击判定放大到 38px */
  .hit { position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; cursor:pointer; }
  .ring { position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%) scale(.55);
    border:1px solid var(--c); opacity:0; pointer-events:none;
    transition:transform .44s cubic-bezier(.22,.9,.28,1), opacity .44s ease; }
  .node:hover .dot, .node.sel .dot { transform:translate(-50%,-50%) scale(1.5); }
  .node:hover .ring, .node.sel .ring { opacity:.6; transform:translate(-50%,-50%) scale(1); }
  .node.sel .ring { opacity:.9; }
  .node.dim { opacity:.2; }

  .lab { position:absolute; left:50%; width:190px; margin-left:-95px; pointer-events:none;
    opacity:0; transition:opacity .4s ease; text-align:center; }
  .lab.show { pointer-events:auto; cursor:pointer; }   /* 标题也可点开卡片 */
  .lab.show, .node:hover .lab { opacity:1; }
  .lab .stem { position:absolute; left:50%; width:1px; opacity:.4; }
  .lab .d { display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--ink-3); margin-bottom:2px; }
  .lab .t { font-family:var(--serif); font-size:14px; font-weight:600; color:var(--ink-2); line-height:1.34;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; transition:color .3s ease; }
  .node:hover .lab .t, .node.sel .lab .t { color:var(--ink); }
  .lab .meta { display:block; font-size:9.5px; color:var(--ink-3); margin-top:3px; letter-spacing:.06em; }

  /* ══════ 详情卡：从光点向下展开 ══════ */
  #card { position:absolute; width:430px; margin-left:-215px; z-index:30;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--card-sh);
    backdrop-filter:blur(20px); overflow:hidden; display:none;
    transform-origin:top center; }
  #card.on { display:block; animation:bloom .5s cubic-bezier(.19,1,.22,1); }
  @keyframes bloom { from{opacity:0; transform:translateY(-10px) scaleY(.94)} to{opacity:1; transform:none} }
  #card .stemUp { position:absolute; left:50%; top:-22px; width:1px; height:22px;
    background:linear-gradient(transparent, var(--c)); opacity:.6; }
  #cardScroll { max-height:min(60vh,560px); overflow-y:auto; overscroll-behavior:contain;
    padding:20px 22px 22px; touch-action:pan-y; }
  #cardScroll::-webkit-scrollbar { width:6px; }
  #cardScroll::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
  .cClose { position:absolute; right:10px; top:10px; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg-2); color:var(--ink-3); cursor:pointer; font-size:12px; z-index:2; }
  .cClose:hover { color:var(--ink); }
  .c-date { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--c); margin-bottom:7px; }
  .c-title { font-family:var(--serif); font-size:21px; font-weight:700; line-height:1.38; margin:0 0 12px; padding-right:26px; }
  .c-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:18px; }

  .c-tags span.st { border-color:color-mix(in srgb, var(--c) 45%, transparent); color:var(--c); }
  /* 每节以细分隔线断开，节奏统一 */
  .sec { margin:0; padding:15px 0 0; border-top:1px solid var(--hair); margin-top:15px; }

  .sec h4 { font-size:9.5px; font-weight:700; letter-spacing:.18em; color:var(--ink-3); margin:0 0 9px; }
  .sec p { margin:0; font-size:13px; line-height:1.75; color:var(--ink-2); }
  .step { display:flex; gap:12px; font-size:12px; color:var(--ink-2); padding:3px 0; position:relative; align-items:flex-start; }
  .step .sd { font-family:var(--mono); font-size:10px; color:var(--ink-3); min-width:72px; padding-top:2px; flex:none; }
  .step .sb { position:relative; padding-left:15px; line-height:1.6; }
  .step .sb::before { content:""; position:absolute; left:0; top:6px; width:5px; height:5px; border-radius:50%;
    background:var(--ink-3); opacity:.55; }
  .step:last-child .sb::before { background:var(--c); opacity:1; }
  .step:last-child .sb { color:var(--ink); font-weight:500; }
  .claim { border-left:2px solid; padding:2px 0 2px 12px; margin-bottom:12px; }

  .claim .sr { font-size:10.5px; margin-top:5px; }
  a { color:var(--ink-3); text-decoration:none; border-bottom:1px solid var(--line); transition:color .25s,border-color .25s; }

  .imp { display:flex; gap:10px; font-size:12px; padding:6px 0; border-bottom:1px solid var(--hair); }

  .imp .v em { display:block; font-style:normal; font-size:10px; color:var(--ink-3); margin-top:2px; }
  .note { font-size:11px; line-height:1.66; color:var(--t-subsidy); background:color-mix(in srgb,var(--t-subsidy) 9%,transparent);

  .srcs { list-style:none; margin:0; padding:0; }

  /* 图片位 */
  .figs { display:flex; flex-direction:column; gap:9px; }

  /* 讨论位 */
  .disc { border-top:1px solid var(--line); margin-top:4px; padding-top:15px; }

  .cm { padding:9px 0; border-bottom:1px solid var(--hair); }

  /* 图标徽章：圆形定宽，释义走 title（长按/悬停） */
  .badge { font-size:11px; font-weight:700; line-height:1; width:20px; height:20px; flex:none;

  .badge.guest   { background:var(--bg-2); color:var(--ink-3); border:1px solid var(--line); }

  /* ══════ 界面外壳 ══════ */
  #bar { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:flex-start; gap:14px;
    padding:16px 20px; pointer-events:none; }
  #bar > * { pointer-events:auto; }
  .mark { font-family:var(--serif); font-size:19px; font-weight:700; line-height:1.1; }
  .mark i { font-style:normal; color:var(--t-tax); }
  .mark small { display:block; font-family:inherit; font-size:9.5px; font-weight:400; color:var(--ink-3);

  #legend { display:flex; gap:11px; flex-wrap:wrap; margin-top:9px; }

  /* ══════════ 竖向模式（窄屏）══════════ */

  /* 议题过滤条：横向滚动 */
  .vfilter { display:flex; gap:6px; overflow-x:auto; padding:10px 16px; scrollbar-width:none;
    border-bottom:1px solid var(--hair); position:sticky; top:59px; z-index:19; background:var(--bg); }
  .vfilter::-webkit-scrollbar { display:none; }
  .vfilter .chip { flex:none; font-size:12px; color:var(--ink-2); background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:5px 12px; display:flex;
    align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .vfilter .chip .sw { width:7px; height:7px; border-radius:50%; background:var(--c); }
  .vfilter .chip.off { opacity:.35; }

  /* 时间轴主体 */
  .vtl { position:relative; padding:8px 0 0; }
  .vtl::before { content:""; position:absolute; left:32px; top:0; bottom:0; width:2px;
    background:linear-gradient(var(--axis), var(--axis)); opacity:.5; }
  .vyear { position:relative; font-family:var(--mono); font-size:12px; letter-spacing:.14em;
    color:var(--ink-3); padding:18px 0 8px 56px; font-weight:600; }
  .vitem { position:relative; padding:0 16px 4px 56px; }
  .vitem .vdot { position:absolute; left:25px; top:16px; width:16px; height:16px; border-radius:50%;
    background:var(--c); box-shadow:0 0 0 4px var(--bg), 0 0 12px var(--c);
    border:2px solid var(--bg); }
  .vrow { width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
    border-left:3px solid var(--c); border-radius:10px; padding:12px 14px; cursor:pointer;
    display:block; font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
  .vrow:active { background:var(--bg-2); }
  .vrow .vd { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-3); }
  .vrow .vt { font-family:var(--serif); font-size:16px; font-weight:600; line-height:1.4;
    margin:3px 0 0; color:var(--ink); }
  .vrow .vmeta { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:7px;
    font-size:11px; color:var(--ink-3); }
  .vrow .vtag { border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
    color:var(--c); border-radius:999px; padding:1px 8px; }
  /* 内联展开卡：复用 .sec/.claim/.imp/.disc 等既有样式 */
  .vcard { display:none; padding:4px 2px 6px; }
  .vitem.open .vcard { display:block; animation:vbloom .4s cubic-bezier(.19,1,.22,1); }
  @keyframes vbloom { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;} }
  .vitem.open .vrow { border-radius:10px 10px 0 0; background:var(--bg-2); }
  .vcard .sec:first-child { border-top:none; margin-top:0; padding-top:12px; }
  .vcard-inner { background:var(--surface); border:1px solid var(--line); border-top:none;
    border-left:3px solid var(--c); border-radius:0 0 10px 10px; padding:2px 14px 14px; }

  /* 详情页签（手机）——纯 CSS，靠 :checked 切换 */
  .vtabs > input { position:absolute; opacity:0; pointer-events:none; }
  .vtabbar { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;
    margin:14px -14px 0; padding:0 14px 8px; border-bottom:1px solid var(--line); }
  .vtabbar::-webkit-scrollbar { display:none; }
  .vtabbar label { flex:none; font-size:12.5px; color:var(--ink-3); background:var(--bg-2);
    border:1px solid var(--line); border-radius:999px; padding:5px 13px; cursor:pointer;
    user-select:none; white-space:nowrap; }
  .vpane { display:none; }
  .vpane .sec:first-child { border-top:none; margin-top:0; padding-top:12px; }
  /* 页签键名取自固定集合，故可用后缀匹配静态写出 */
  .vtabs input[id$="-overview"]:checked ~ .vtabbar label[data-k="overview"],
  .vtabs input[id$="-chain"]:checked    ~ .vtabbar label[data-k="chain"],
  .vtabs input[id$="-claims"]:checked   ~ .vtabbar label[data-k="claims"],
  .vtabs input[id$="-hist"]:checked     ~ .vtabbar label[data-k="hist"],
  .vtabs input[id$="-srcs"]:checked     ~ .vtabbar label[data-k="srcs"],
  .vtabs input[id$="-disc"]:checked     ~ .vtabbar label[data-k="disc"] {
    background:var(--c); border-color:var(--c); color:#fff; }
  .vtabs input[id$="-overview"]:checked ~ .vpanes .vpane[data-k="overview"],
  .vtabs input[id$="-chain"]:checked    ~ .vpanes .vpane[data-k="chain"],
  .vtabs input[id$="-claims"]:checked   ~ .vpanes .vpane[data-k="claims"],
  .vtabs input[id$="-hist"]:checked     ~ .vpanes .vpane[data-k="hist"],
  .vtabs input[id$="-srcs"]:checked     ~ .vpanes .vpane[data-k="srcs"],
  .vtabs input[id$="-disc"]:checked     ~ .vpanes .vpane[data-k="disc"] { display:block; }

  /* 证据强度指示 —— 让来源状态对读者可见 */
  .srcbadge { display:inline-flex; align-items:center; gap:4px; font-size:10.5px;
    border-radius:999px; padding:1px 8px; border:1px solid; white-space:nowrap; }
  .srcbadge.ok      { color:#0f8073; border-color:color-mix(in srgb,#0f8073 40%,transparent);
                      background:color-mix(in srgb,#0f8073 8%,transparent); }
  .srcbadge.partial { color:#b8770a; border-color:color-mix(in srgb,#b8770a 40%,transparent);
                      background:color-mix(in srgb,#b8770a 8%,transparent); }
  .srcbadge.none    { color:var(--ink-3); border-color:var(--line); background:var(--bg-2); }
  :root[data-theme="dark"] .srcbadge.ok      { color:#35d0c0; }
  :root[data-theme="dark"] .srcbadge.partial { color:#f0a830; }
  /* 卡片顶部的醒目提示（仅在无来源时出现） */
  .srcnote { font-size:11.5px; line-height:1.6; border-radius:7px; padding:8px 10px; margin:10px 0 2px;
    color:var(--ink-2); background:var(--bg-2); border-left:3px solid var(--ink-3); }
  .srcnote b { color:var(--ink); }

  /* 月份小标题（年份之下的次级分组） */
  .vmonth { position:relative; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
    color:var(--ink-3); padding:14px 0 6px 56px; opacity:.8; }
  .vmonth::before { content:""; position:absolute; left:26px; top:50%; width:14px; height:1px;
    background:var(--line); }

  /* ══════ 讨论（已接后端）══════ */
  .disc .dh .cnt { font-size:9.5px; color:var(--ink-3); }
  .cm .when { font-size:10px; color:var(--ink-3); font-family:var(--mono); }
  .cm .flag { margin-left:auto; font-size:11px; color:var(--ink-3); background:none; border:none;
    cursor:pointer; padding:2px 5px; border-radius:5px; line-height:1; }
  .cm .flag:hover { color:var(--t-cost); background:var(--hair); }
  .cm.folded .body { opacity:.42; }
  .cm.folded .body::after { content:" · 已被折叠"; font-size:10px; color:var(--t-cost); }
  .cbox { margin-top:11px; border:1px solid var(--line); border-radius:9px; padding:9px 11px;
    background:var(--bg-2); }
  .cbox textarea { width:100%; box-sizing:border-box; resize:none; font:inherit; font-size:12.5px;
    line-height:1.65; color:var(--ink); background:transparent; border:none; outline:none; min-height:44px; }
  .cbox textarea::placeholder { color:var(--ink-3); }
  .cbar { display:flex; align-items:center; gap:9px; margin-top:6px; }
  /* 字数计数器就是规则本身：不合规时它是红的，按钮是灰的，不需要额外解释 */
  .cnum { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
  .cnum.bad { color:var(--t-cost); }
  .cnum.ok  { color:var(--t-graft); }
  .cbar .sp { flex:1; }
  .btn { font:inherit; font-size:12px; padding:6px 15px; border-radius:999px; cursor:pointer;
    border:1px solid var(--c); background:var(--c); color:#fff; transition:opacity .2s; }
  .btn:disabled { opacity:.3; cursor:not-allowed; }
  .btn.ghost { background:none; color:var(--ink-2); border-color:var(--line); }
  .btn.ghost:hover { border-color:var(--ink-3); color:var(--ink); }
  .cmsg { font-size:11px; line-height:1.55; margin-top:7px; }
  .cmsg.err { color:var(--t-cost); }
  .cmsg.ok  { color:var(--t-graft); }
  .crule { font-size:10.5px; color:var(--ink-3); line-height:1.6; margin-top:8px; }
  .cempty { font-size:11.5px; color:var(--ink-3); padding:8px 0; }

  /* ══════ 议题脉络 ══════ */
  .chain { margin-top:2px; }
  .chain .ct { display:flex; align-items:baseline; gap:8px; margin-bottom:9px; }
  .chain .ct b { font-size:12px; }
  .chain .ct em { font-style:normal; font-size:10px; color:var(--ink-3); }
  .chain .cdesc { font-size:11px; color:var(--ink-3); line-height:1.6; margin-bottom:9px; }
  /* 脉络本身是一条缩微时间轴：同一议题反复出现，形状比文字更有说服力 */
  .chain ol { list-style:none; margin:0; padding:0 0 0 15px; position:relative; }
  .chain ol::before { content:""; position:absolute; left:3px; top:5px; bottom:5px;
    width:1px; background:var(--line); }
  .chain li { position:relative; padding:5px 0; font-size:12px; line-height:1.6; }
  .chain li::before { content:""; position:absolute; left:-15px; top:12px; width:7px; height:7px;
    border-radius:50%; background:var(--ink-3); transform:translateX(-1px); }
  .chain li.here::before { background:var(--c); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent); }
  .chain li.here { font-weight:600; }
  .chain li .cy { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-right:7px; }
  .chain li .cwho { font-size:10.5px; color:var(--ink-3); margin-top:2px; line-height:1.5; }
  #infoWrap { position:fixed; inset:0; z-index:80; display:none; }
  #infoWrap.on { display:block; }
  #infoWrap .veil { position:absolute; inset:0; background:rgba(0,0,0,.42); backdrop-filter:blur(3px); }
  #infoCard { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(92vw,520px); max-height:82vh; overflow-y:auto; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.28); }
  #infoCard h3 { font-family:var(--serif); font-size:21px; margin:0 0 3px; }
  #infoCard .kind { font-size:10.5px; letter-spacing:.1em; color:var(--ink-3); margin-bottom:14px; }
  .chain li button { font:inherit; font-size:12px; text-align:left; color:var(--ink-2);
    background:none; border:none; padding:0; cursor:pointer; border-bottom:1px solid transparent; }
  .chain li button:hover { color:var(--c); border-bottom-color:var(--c); }
  .chain li.here button { color:var(--ink); cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip2 { font-size:11px; color:var(--ink-2); background:var(--bg-2); border:1px solid var(--line);
    border-radius:999px; padding:3px 10px; cursor:pointer; font-family:inherit; }
  .chip2:hover { border-color:var(--c); color:var(--c); }
  .chip2 .r { color:var(--ink-3); font-size:9.5px; margin-left:4px; }

  /* ══════ 投稿浮层 ══════ */
  #subBtn { font:inherit; font-size:12px; color:var(--ink-2); background:var(--glass);
    backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; cursor:pointer; }
  #subBtn:hover { color:var(--ink); border-color:var(--ink-3); }
  #subWrap { position:fixed; inset:0; z-index:80; display:none; }
  #subWrap.on { display:block; }
  #subWrap .veil { position:absolute; inset:0; background:rgba(0,0,0,.42); backdrop-filter:blur(3px); }
  #subCard { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(92vw,560px); max-height:86vh; overflow-y:auto; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.28); }
  #subCard h3 { font-family:var(--serif); font-size:20px; margin:0 0 4px; }
  #subCard .lead { font-size:11.5px; color:var(--ink-3); line-height:1.65; margin:0 0 16px; }
  #subCard label.f { display:block; font-size:10.5px; letter-spacing:.08em; color:var(--ink-3);
    margin:13px 0 5px; }
  #subCard input[type=text], #subCard input[type=date], #subCard input[type=url], #subCard textarea {
    width:100%; box-sizing:border-box; font:inherit; font-size:12.5px; color:var(--ink);
    background:var(--bg-2); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px; outline:none; }
  #subCard input:focus, #subCard textarea:focus { border-color:var(--ink-3); }
  #subCard textarea { min-height:88px; resize:vertical; line-height:1.65; }
  #subKind { display:flex; gap:6px; flex-wrap:wrap; }
  #subKind label { font-size:12px; padding:5px 13px; border:1px solid var(--line); border-radius:999px;
    cursor:pointer; color:var(--ink-2); }
  #subKind input { position:absolute; opacity:0; pointer-events:none; }
  #subKind label:has(input:checked) { background:var(--t-tax); border-color:var(--t-tax); color:#fff; }
  #srcList { display:flex; flex-direction:column; gap:6px; }
  #peek { margin-top:8px; }
  .pk { font-size:11px; line-height:1.6; border-left:2px solid var(--line); padding:5px 0 5px 10px;
    color:var(--ink-3); }
  .pk b { color:var(--ink-2); font-weight:600; }
  .pk .t1 { color:var(--t-graft); } .pk .t2 { color:var(--t-tax); }
  .pk .t3 { color:var(--t-cost); } .pk .warn { color:var(--t-cost); }
  #titleAuto { color:var(--t-graft); }
  .srcHint { font-size:10.5px; color:var(--ink-3); line-height:1.6; margin-top:6px; }
  #subFoot { display:flex; align-items:center; gap:10px; margin-top:18px; }
  #subMsg { font-size:11.5px; line-height:1.55; }
  #subMsg.err { color:var(--t-cost); } #subMsg.ok { color:var(--t-graft); }
  @media (max-width:760px){ #subCard{ padding:18px 16px; border-radius:12px; } }
</style>
</head>
<body>

<div id="stage"><div id="layer"></div></div>
<div id="empty" hidden>
  <h1>faham</h1>
  <p>档案尚未收录数据。</p>
  <p class="sub">收录准则见 <code>docs/governance.md</code>；数据结构见 <code>db/schema.sql</code>。</p>
  <!-- 空档案不是占位符，是这个站点的起点：规则先立，数据后收。
       所以投稿入口在没有数据时反而是页面上最重要的一个按钮。 -->
  <p class="sub" style="margin-top:22px">第一条记录可以由你写。</p>
  <button class="btn" data-open-sub style="--c:var(--t-tax);margin-top:10px">投稿一条事件</button>
</div>
<div id="axisLine"></div>
<div class="edge l"></div><div class="edge r"></div>
<div id="ruler"></div>

<div id="bar">
  <div>
    <div class="mark">faham<i>.</i><small>在时间里看见政策</small></div>
    <div id="legend"></div>
  </div>
  <div class="spacer"></div>
  <div id="scaleTag">年</div>
  <button id="subBtn" data-open-sub>投稿 · 纠错</button>
  <div class="pill" id="ranges">
    <button data-r="0.08">近1月</button><button data-r="0.5">近半年</button><button data-r="2">近2年</button><button data-r="0">全部</button>
  </div>
  <div class="pill z"><button id="zout" aria-label="缩小">−</button><button id="zin" aria-label="放大">＋</button></div>
  <div class="pill"><button id="theme" aria-label="切换主题">◐</button></div>
</div>

<div id="mini"><div class="track"></div><div class="view"></div></div>
<div id="hint"><b>任意方向拖拽</b>移动 · <b>⌘/Ctrl+滚轮</b> 或双指捏合缩放 · <b>点击光点</b>展开</div>

<!-- 竖向模式（窄屏）：原生滚动的时间线 -->
<div id="vwrap">
  <div class="vhead">
    <div class="mark">faham<i>.</i><small>在时间里看见政策</small></div>
    <div class="sp"></div>
    <button id="vsub" data-open-sub aria-label="投稿" title="投稿 · 纠错">✎</button>
    <button id="vtheme" aria-label="切换主题">◐</button>
  </div>
  <div class="vfilter" id="vfilter"></div>
  <div class="vtl" id="vtl"></div>
</div>

<!-- 投稿浮层。表单本身就是收录准则的复述：不填来源就提交不了，
     不是因为前端拦，是因为数据库的 CHECK 约束会拒绝（见 db/live.sql）。 -->
<div id="subWrap" role="dialog" aria-modal="true" aria-labelledby="subTitle">
  <div class="veil" data-close-sub></div>
  <div id="subCard" role="document">
    <h3 id="subTitle">投稿 · 纠错</h3>
    <p class="lead">这里不比谁说得响，比谁给得出来源。投稿会进入复核队列，不会直接上线；
      被拒也会记录理由。你不需要注册，也不会被要求填真名。</p>

    <label class="f">你想做的是</label>
    <div id="subKind">
      <label><input type="radio" name="kind" value="lead" checked>丢个线索</label>
      <label><input type="radio" name="kind" value="correction">纠错</label>
      <label><input type="radio" name="kind" value="source">补来源</label>
      <label><input type="radio" name="kind" value="new_event">完整新增</label>
    </div>
    <p class="srcHint" id="kindHint" style="margin-top:8px"></p>

    <!-- 链接放在第一位：这是唯一一个每种投稿都必须有、而且最容易给的东西 -->
    <label class="f">来源链接<span id="srcNeed"></span></label>
    <div id="srcList"></div>
    <button class="btn ghost" id="addSrc" type="button" style="margin-top:7px;font-size:11px;padding:4px 11px">+ 再加一个</button>
    <div id="peek"></div>

    <label class="f" for="subT">标题<span id="titleAuto"></span></label>
    <input type="text" id="subT" maxlength="200" placeholder="贴上链接后会自动带出，可以改">

    <div data-adv hidden>
      <label class="f" for="subD">发生日期（不确定可留空）</label>
      <input type="date" id="subD">

      <label class="f" for="subB">说明</label>
      <textarea id="subB" maxlength="1200" placeholder="发生了什么、改变了什么、影响到谁。用你自己的话写事实与后果，不要整段照抄原文，也不要写动机推测。"></textarea>
      <p class="srcHint">「独立」指不同机构。同一集团旗下多家媒体转载同一通稿，算 1 个。
        官方文件、法院记录、议会记录、统计数据优先。</p>
    </div>

    <label class="f" for="subC">联系方式（选填，仅在需要向你确认时使用）</label>
    <input type="text" id="subC" maxlength="120" placeholder="邮箱或任何你愿意留的方式；留空也能投稿">

    <div id="subFoot">
      <button class="btn" id="subGo" style="--c:var(--t-tax)">提交</button>
      <button class="btn ghost" data-close-sub type="button">取消</button>
      <span id="subMsg"></span>
    </div>
  </div>
</div>

<!-- 人物／组织档案：只是「该主体在本档案中的事件索引」，没有评分也没有结论 -->
<div id="infoWrap" role="dialog" aria-modal="true">
  <div class="veil" data-close-info></div>
  <div id="infoCard"></div>
</div>

<script>
/* ═══════════ 事件数据 ═══════════
   img:     [{cap:"图注", src:"可选。留空则显示占位框"}]  ← 建议自托管，别外链（外链会让读者浏览器请求第三方）
   discuss: 讨论条数（阶段2接后端后才真实）
   ═══════════════════════════ */
const TOPICS = {
  subsidy:{name:"补贴改革",c:"var(--t-subsidy)"}, tax:{name:"税务",c:"var(--t-tax)"},
  cost:{name:"生活成本",c:"var(--t-cost)"}, vote:{name:"选举",c:"var(--t-vote)"},
  graft:{name:"反贪问责",c:"var(--t-graft)"}, rights:{name:"公民与制度",c:"var(--t-rights)"}
};

/* 证据强度 —— 平台的核心承诺是「每条主张附来源」，
   因此来源状态必须对读者可见，而不是藏在数据里。 */
function sourceLevel(e){
  const hasUrl  = (e.claims||[]).some(c=>c.url) || (e.srcs||[]).some(s=>s.u);
  const hasName = (e.claims||[]).some(c=>c.sr && c.sr!=='—') || (e.srcs||[]).length;
  // 图标承担辨识，文字只留最短的限定词；title 供长按/悬停查看完整说明
  if (hasUrl)  return { k:'ok',      i:'🔗', t:'来源', full:'附有可点击来源，读者可自行核对' };
  if (hasName) return { k:'partial', i:'◐',  t:'无链接', full:'已注明出处，但尚未附上可点击链接' };
  return          { k:'none',    i:'○',  t:'无来源', full:'尚未附上可核查来源，不应视为已核实的档案条目' };
}
const srcBadge = sl => `<span class="srcbadge ${sl.k}" title="${sl.full}">${sl.i} ${sl.t}</span>`;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═══════════ 事件标识 ═══════════
   评论要挂在事件上，就需要一个稳定标识。优先用数据里的 slug；
   缺失时按「日期 + 标题短哈希」推导——代价是标题一旦改动，旧评论就会与事件脱钩。
   数据补齐 slug 之后不应再依赖这个推导值。 */
function hash4(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(36);
}
const evSlug = e => e.slug || `${e.date}-${hash4(e.title||'')}`;

/* ═══════════ 后端 ═══════════
   静态站 + Pages Functions。读事件仍走静态 JSON（每个分支各自一份），
   只有用户写入的内容才碰数据库。后端不可用时全部优雅降级，不让卡片崩掉。 */
const API = {
  async get(p){
    const r = await fetch(p, { headers:{ accept:'application/json' } });
    return r.json();
  },
  async post(p, body){
    const r = await fetch(p, { method:'POST',
      headers:{ 'content-type':'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(()=>({}));
    return { status:r.status, ...d };
  }
};

let THREADS = [], ACTORS = [];
const ROLE = { office:'在任', proposer:'提出', opponent:'反对', affected:'受影响' };

const threadsOf = e => THREADS.filter(t => t.events.includes(EVENTS.indexOf(e)));
function actorsOf(e){
  const i = EVENTS.indexOf(e);
  return ACTORS.map(a => {
    const hit = (a.events||[]).find(x => x.i === i);
    return hit ? { ...a, role: hit.role } : null;
  }).filter(Boolean);
}

function ago(iso){
  const d = new Date(iso), m = (Date.now() - d) / 60000;
  if (m < 1) return '刚刚';
  if (m < 60) return `${Math.floor(m)} 分钟前`;
  if (m < 1440) return `${Math.floor(m/60)} 小时前`;
  if (m < 10080) return `${Math.floor(m/1440)} 天前`;
  return iso.slice(0,10);
}

/* ═══════════ 事件数据 ═══════════
   数据不写死在代码里：运行时从 data/events.json 载入。
   该文件由数据库导出（见 db/schema.sql 的 export_events 视图），
   或在无后端时手工维护。空数组即为「纯架构」状态。
   ═══════════════════════════ */
let EVENTS = [];

/* ═══════════ 详情卡内容 ═══════════
   拆成命名分段，供两种装配方式共用：
     buildCardHTML(e)      桌面：全部平铺
     buildCardTabsHTML(e)  手机：分页签，避免一次铺开太长 */
const CARD_SECTIONS = {
  why: e => e.why ? `<div class="sec"><h4>起因</h4><p>${e.why}</p></div>` : '',

  img: e => e.img?.length ? `<div class="sec"><h4>图像资料</h4><div class="figs">${
    e.img.map(g=>`<div class="fig">${g.src?`<img src="${g.src}" alt="" loading="lazy">`:`<div class="ph">🖼 图片位</div>`}<div class="cap">${g.cap}</div></div>`).join('')}</div></div>` : '',

  hist: e => e.hist?.length ? `<div class="sec"><h4>状态历程 · 留痕不删</h4>${
    e.hist.map(h=>`<div class="step"><span class="sd">${h.d}</span><span class="sb">${h.t}</span></div>`).join('')}</div>` : '',

  claims: e => e.claims?.length ? `<div class="sec"><h4>各方主张 · 并列呈现</h4>${
    e.claims.map(c=>`<div class="claim ${c.side}"><div class="who">${c.who}</div><div class="tx">${c.tx}</div>${
      c.sr&&c.sr!=='—'?`<div class="sr">依据：${c.url?`<a href="${c.url}" target="_blank" rel="noopener noreferrer">${c.sr}</a>`:c.sr}</div>`:''}</div>`).join('')}</div>` : '',

  impact: e => (e.impact?.length||e.note) ? `<div class="sec"><h4>差异化影响 · 用数据说话</h4>${
    (e.impact||[]).map(i=>`<div class="imp"><span class="k">${i.k}</span><span class="v">${i.v}${i.s&&i.s!=='—'?`<em>来源：${i.s}</em>`:''}</span></div>`).join('')
    }${e.note?`<div class="note">${e.note}</div>`:''}</div>` : '',

  srcs: e => e.srcs?.length ? `<div class="sec"><h4>主要来源</h4><ul class="srcs">${
    e.srcs.map(x=>`<li><a href="${x.u}" target="_blank" rel="noopener noreferrer">${x.l}</a></li>`).join('')}</ul></div>` : '',

  /* 议题脉络：同一件事在几十年里反复出现。
     一条缩微时间轴比任何文字都更能说明「这不是新问题」。 */
  chain: e => {
    const ts = threadsOf(e);
    if (!ts.length) return '';
    return `<div class="sec"><h4>议题脉络 · 同一件事反复出现</h4>${ts.map(th=>`
      <div class="chain">
        <div class="ct"><b>${esc(th.name)}</b><em>档案内 ${th.events.length} 次</em></div>
        ${th.desc?`<div class="cdesc">${esc(th.desc)}</div>`:''}
        <ol>${th.events.map(i=>{
          const x = EVENTS[i]; if (!x) return '';
          const here = x === e;
          return `<li class="${here?'here':''}">
            <span class="cy">${esc(x.label || x.date.slice(0,4))}</span>
            <button type="button" data-goto="${i}"${here?' disabled':''}>${esc(x.title)}</button>
            ${x.who?`<div class="cwho">${esc(x.who)}</div>`:''}</li>`;
        }).join('')}</ol>
      </div>`).join('')}</div>`;
  },

  /* 人物与组织：只索引已收录的事件，不评分、不characterise。
     在马来西亚做人物页，越少形容词越安全，也越诚实。 */
  actors: e => {
    const list = actorsOf(e);
    if (!list.length) return '';
    // 徽章上只留名字和条数；角色放 title，避免一排「受影响·18」把卡片塞满
    return `<div class="sec"><h4>相关人物与组织</h4><div class="chips">${
      list.map(a=>`<button class="chip2" data-actor="${esc(a.key)}"
        title="本事件中的角色：${esc(ROLE[a.role]||a.role)} · 档案内共 ${(a.events||[]).length} 条记录"
        >${esc(a.name)}<span class="r">${(a.events||[]).length}</span></button>`).join('')
    }</div><div class="srcHint">点击查看该人物／组织在本档案中的全部记录。只列事件，不作评价、不打分。</div></div>`;
  },

  /* 讨论：已接后端。规则由数据库执行（db/live.sql），前端只是把规则说清楚。 */
  disc: e => `<div class="disc" data-ev="${esc(evSlug(e))}">
    <div class="dh"><b>讨论</b><em class="cnt">载入中…</em></div>
    <div class="clist"></div>
    <div class="cbox">
      <textarea rows="2" maxlength="80" placeholder="30–50 字。写你查到的、能被核对的东西。"></textarea>
      <div class="cbar"><span class="cnum">0 / 30–50</span><span class="sp"></span>
        <button class="btn send" type="button" disabled>发表</button></div>
      <div class="cmsg"></div>
    </div>
    <div class="crule">每人每帖每 24 小时 2 条 · 计数绑一次性匿名标识，不存 IP ·
      被 3 个不同网络举报自动折叠（折叠不是删除，仍可展开）</div></div>`
};

/* 来源提示：仅在证据不足时出现，措辞尽量短 */
function srcNote(e){
  const sl = sourceLevel(e);
  if (sl.k==='ok') return '';
  return sl.k==='none'
    ? `<div class="srcnote"><b>尚无可核查来源</b>，不应视为已核实条目。</div>`
    : `<div class="srcnote">已注明出处，<b>但无可点击链接</b>。</div>`;
}

/* 完整卡头（桌面用；手机的行卡已显示这些信息，不重复） */
function cardHead(e){
  const tp=TOPICS[e.topic];
  return `<div class="c-date">${e.label}</div><h3 class="c-title">${e.title}</h3>
    <div class="c-tags"><span class="st">${tp.name}</span>${e.who?`<span>${e.who}</span>`:''}
      ${srcBadge(sourceLevel(e))}</div>${srcNote(e)}`;
}

/* 桌面：全部平铺 */
function buildCardHTML(e){
  return cardHead(e) + ['why','img','hist','chain','claims','impact','actors','srcs','disc']
    .map(k => CARD_SECTIONS[k](e)).join('');
}

/* 手机：分页签。只保留有内容的页签，避免出现空白页 */
function buildCardTabsHTML(e, uid){
  const TABS = [
    { key:'overview', label:'概览', parts:['why','impact','img'] },
    { key:'chain',    label:'脉络', parts:['chain','actors'] },
    { key:'claims',   label:'主张', parts:['claims'] },
    { key:'hist',     label:'历程', parts:['hist'] },
    { key:'srcs',     label:'来源', parts:['srcs'] },
    { key:'disc',     label:'讨论', parts:['disc'] }
  ];
  const built = TABS
    .map(t => ({ ...t, html: t.parts.map(p => CARD_SECTIONS[p](e)).join('') }))
    .filter(t => t.html.trim());
  // 不重复标题／日期／议题／责任方 —— 上方的行卡已经显示过了
  if (!built.length) return srcNote(e);

  const radios = built.map((t,i)=>
    `<input type="radio" name="tab-${uid}" id="tab-${uid}-${t.key}"${i===0?' checked':''}>`).join('');
  const labels = built.map(t =>
    `<label for="tab-${uid}-${t.key}" data-k="${t.key}">${t.label}</label>`).join('');
  const panes = built.map(t =>
    `<div class="vpane" data-k="${t.key}">${t.html}</div>`).join('');

  return `${srcNote(e)}<div class="vtabs" data-uid="${uid}">${radios}
    <div class="vtabbar">${labels}</div><div class="vpanes">${panes}</div></div>`;
}

/* ═══════════ 卡片内的交互装配 ═══════════
   两种布局都把 HTML 直接塞进容器，装配统一走这里，避免各写一份。 */
function hydrate(root){
  root.querySelectorAll('.disc[data-ev]').forEach(d => {
    if (d.dataset.hy) return;
    d.dataset.hy = '1';
    wireDiscussion(d);
  });
}

function wireDiscussion(d){
  const slug = d.dataset.ev;
  const list = d.querySelector('.clist'), cnt = d.querySelector('.cnt');
  const ta = d.querySelector('textarea'), num = d.querySelector('.cnum');
  const send = d.querySelector('.send'), msg = d.querySelector('.cmsg');

  const row = c => `<div class="cm ${c.status==='folded'?'folded':''}" data-id="${esc(c.id)}">
      <div class="top"><span class="badge guest" title="访客：未注册，未验证身份">·</span>
        <span class="who2">访客</span><span class="when">${esc(ago(c.created_at))}</span>
        <button class="flag" type="button" title="举报">⚑</button></div>
      <div class="body">${esc(c.body)}</div></div>`;

  function paint(rows){
    cnt.textContent = `${rows.length} 条`;
    list.innerHTML = rows.length ? rows.map(row).join('')
      : `<div class="cempty">还没有人发言。第一条由你来写。</div>`;
  }

  API.get(`/api/comments?event=${encodeURIComponent(slug)}`).then(r => {
    if (r.offline || r.ok === false) {
      cnt.textContent = '后端未接通';
      list.innerHTML = `<div class="cempty">讨论功能在本环境不可用（静态预览无后端）。</div>`;
      ta.disabled = true; send.disabled = true;
      return;
    }
    paint(r.comments || []);
  }).catch(()=>{ cnt.textContent = '—'; });

  // 计数器就是规则：不合规时它变红、按钮变灰，不必再写一段说明
  const count = () => {
    const n = [...ta.value.trim()].length;
    num.textContent = `${n} / 30–50`;
    const ok = n >= 30 && n <= 50;
    num.className = 'cnum ' + (n === 0 ? '' : ok ? 'ok' : 'bad');
    send.disabled = !ok;
    return n;
  };
  ta.addEventListener('input', count);

  send.addEventListener('click', async () => {
    send.disabled = true; msg.className = 'cmsg'; msg.textContent = '提交中…';
    const r = await API.post('/api/comments', { event: slug, body: ta.value.trim() });
    if (r.ok) {
      ta.value = ''; count();
      msg.className = 'cmsg ok'; msg.textContent = '已发表。';
      const fresh = await API.get(`/api/comments?event=${encodeURIComponent(slug)}`);
      paint(fresh.comments || []);
    } else {
      msg.className = 'cmsg err'; msg.textContent = r.error || '提交失败。';
      count();
    }
  });

  list.addEventListener('click', async ev => {
    const b = ev.target.closest('.flag'); if (!b) return;
    const id = b.closest('.cm').dataset.id;
    const reason = prompt('举报理由（会记录，不公开显示）：');
    if (!reason || !reason.trim()) return;
    const r = await API.post('/api/reports', { id, reason: reason.trim() });
    msg.className = 'cmsg ' + (r.ok ? 'ok' : 'err');
    msg.textContent = r.ok ? '已收到举报。累计 3 个不同网络才会折叠。' : (r.error || '举报失败。');
  });
}

/* ═══════════ 跨事件跳转与永久链接 ═══════════
   两个布局引擎各自注册自己的跳转方式；脉络与人物档案都调这一个入口。
   同时把当前事件写进 URL：一个档案如果不能把某一条单独指给别人看，
   它就只是一个网站，不是可被引用的档案。 */
window.gotoEvent = null;

const setHash = e => { try { history.replaceState(null,'', e ? '#e='+encodeURIComponent(evSlug(e)) : location.pathname); } catch(_){} };

function applyHash(){
  const m = /^#e=(.+)$/.exec(location.hash || '');
  if (!m || !window.gotoEvent) return;
  const slug = decodeURIComponent(m[1]);
  const e = EVENTS.find(x => evSlug(x) === slug);
  if (e) setTimeout(()=>window.gotoEvent(e), 60);
}

document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-goto]');
  if (g && window.gotoEvent) {
    const e = EVENTS[+g.dataset.goto];
    if (e) { closeInfo(); window.gotoEvent(e); }
    return;
  }
  const a = ev.target.closest('[data-actor]');
  if (a) { openActor(a.dataset.actor); }
});

/* ── 人物／组织档案 ── */
const infoWrap = () => document.getElementById('infoWrap');
const closeInfo = () => infoWrap().classList.remove('on');

function openActor(key){
  const a = ACTORS.find(x => x.key === key);
  if (!a) return;
  const KIND = { person:'人物', party:'政党', coalition:'阵线', govt_body:'机构' };
  const rows = (a.events||[])
    .map(x => ({ ...x, e: EVENTS[x.i] })).filter(x => x.e)
    .sort((p,q) => p.e.date.localeCompare(q.e.date));

  document.getElementById('infoCard').innerHTML = `
    <h3>${esc(a.name)}${a.name_en?` <span style="font-size:13px;color:var(--ink-3)">${esc(a.name_en)}</span>`:''}</h3>
    <div class="kind">${KIND[a.kind]||''}${a.active?` · ${esc(a.active)}`:''} · 档案内 ${rows.length} 条记录</div>
    <div class="chain"><ol>${rows.map(x=>`<li>
      <span class="cy">${esc(x.e.label || x.e.date.slice(0,4))}</span>
      <button type="button" data-goto="${x.i}">${esc(x.e.title)}</button>
      <div class="cwho">${esc(ROLE[x.role]||x.role)}</div></li>`).join('')}</ol></div>
    <p class="srcHint" style="margin-top:16px">本页只是索引：列出该主体在本档案中出现过的事件与其角色。
      不做评分、不下结论、不收录与公职行为无关的私人事项。
      每条记录的依据与来源，请点进该事件查看。</p>
    <div id="subFoot"><button class="btn ghost" data-close-info type="button">关闭</button></div>`;
  infoWrap().classList.add('on');
}

/* ═══════════ 投稿浮层 ═══════════
   分档的理由：贡献的成本要与贡献的分量相称。
   「我看到一条新闻」和「我要新增一条档案条目」如果填一样多的字，两种人都不会填。
   所以默认是最低的那一档——一个链接就够，标题和日期由机器去抄。 */
const KIND_HINT = {
  lead:       '一个链接就够。标题和日期会自动带出来，说明可以不写。',
  correction: '指出档案里哪里错了，附上能证明的链接。',
  source:     '给已有条目补上可点击的来源。',
  new_event:  '完整新增一条档案条目：需要 ≥2 个独立来源，以及你自己写的说明。'
};

function wireSubmit(){
  const wrap = document.getElementById('subWrap');
  const srcList = document.getElementById('srcList');
  const msg = document.getElementById('subMsg');
  const need = document.getElementById('srcNeed');
  const hint = document.getElementById('kindHint');
  const peek = document.getElementById('peek');
  const titleEl = document.getElementById('subT');
  const titleAuto = document.getElementById('titleAuto');

  const kindOf = () => document.querySelector('#subKind input:checked').value;

  /* 贴上链接 → 后端只取标题／日期／出处，永不取正文。
     该人写的是「发生了什么、改变了什么」，那部分机器抄不来；
     标题和日期机器抄得比人准，也比人快。 */
  let peekSeq = 0;
  async function doPeek(input){
    const url = input.value.trim();
    if (!/^https?:\/\/[^\s]{6,}$/.test(url)) return;
    const my = ++peekSeq;
    peek.innerHTML = `<div class="pk">读取来源信息…</div>`;
    const r = await API.get('/api/peek?url=' + encodeURIComponent(url)).catch(()=>null);
    if (my !== peekSeq) return;                       // 抢答保护：只认最后一次
    if (!r || !r.ok) {
      peek.innerHTML = `<div class="pk warn">读不到这个链接的信息（${esc(r?.error||'失败')}），手动填也行。</div>`;
      return;
    }
    const TIER = { 1:['t1','原始文件'], 2:['t2','新闻报道'], 3:['t3','中文报'], 0:['','未登记来源'] };
    const [cls, label] = TIER[r.tier] || TIER[0];
    peek.innerHTML = `<div class="pk">
      <b>${esc(r.site)}</b> · <span class="${cls}">${label}${r.tier_note?' · '+esc(r.tier_note):''}</span>
      ${r.published?` · ${esc(r.published)}`:''}
      ${r.headline_only?`<br><span class="warn">标题只是标题，不等于事实。请用自己的话写说明，别整段照抄。</span>`:''}
    </div>`;
    if (r.title && !titleEl.value.trim()) {
      titleEl.value = r.title;
      titleAuto.textContent = ' · 已自动带出';
    }
    const d = document.getElementById('subD');
    if (r.published && d && !d.value) d.value = r.published;
  }

  const addSrcInput = () => {
    const i = document.createElement('input');
    i.type = 'url'; i.placeholder = 'https://…';
    i.addEventListener('change', () => doPeek(i));
    i.addEventListener('paste', () => setTimeout(()=>doPeek(i), 30));
    srcList.appendChild(i);
    return i;
  };
  addSrcInput();
  document.getElementById('addSrc').addEventListener('click', addSrcInput);

  function syncKind(){
    const k = kindOf();
    hint.textContent = KIND_HINT[k];
    need.textContent = k === 'new_event' ? ' · 需 ≥2 个独立来源' : ' · 1 个就够';
    document.querySelectorAll('[data-adv]').forEach(el => { el.hidden = (k === 'lead'); });
    if (k === 'new_event' && srcList.children.length < 2) addSrcInput();
  }
  document.getElementById('subKind').addEventListener('change', syncKind);
  syncKind();

  // #submit 可直接打开投稿表单，方便把「欢迎投稿」做成一个能发出去的链接
  const open = () => { msg.textContent=''; wrap.classList.add('on'); };
  if (location.hash === '#submit') open();
  const close = () => wrap.classList.remove('on');
  document.querySelectorAll('[data-open-sub]').forEach(b => b.addEventListener('click', open));
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-sub]')) close();
    if (e.target.closest('[data-close-info]')) closeInfo();
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') { close(); closeInfo(); } });

  document.getElementById('subGo').addEventListener('click', async () => {
    const sources = [...srcList.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
    msg.className = ''; msg.textContent = '提交中…';
    const r = await API.post('/api/submissions', {
      kind: kindOf(),
      title: document.getElementById('subT').value,
      occurred_on: document.getElementById('subD').value || null,
      body: document.getElementById('subB').value,
      sources,
      contact: document.getElementById('subC').value
    });
    if (r.ok) {
      msg.className = 'ok';
      msg.textContent = '已进入复核队列。通过与否都会记录理由。';
      ['subT','subD','subB','subC'].forEach(id => document.getElementById(id).value = '');
      srcList.querySelectorAll('input').forEach(i => i.value = '');
      peek.innerHTML = ''; titleAuto.textContent = '';
    } else {
      msg.className = 'err';
      msg.textContent = r.error || '提交失败：后端可能尚未接通。';
    }
  });
}

/* ═══════════ 横向引擎（桌面）═══════════ */
function boot() {
  const DAY = 864e5, $ = id => document.getElementById(id);
  const stage=$('stage'), layer=$('layer'), axisLine=$('axisLine'), ruler=$('ruler'),
        mini=$('mini'), miniView=mini.querySelector('.view'), hint=$('hint'), scaleTag=$('scaleTag');

  const evs = EVENTS.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  evs.forEach((e,i)=>{ e._i=i; e._t=new Date(e.date).getTime(); });
  const PAD=120*DAY, T0=evs[0]._t-PAD, T1=evs[evs.length-1]._t+PAD, SPAN=(T1-T0)/DAY;

  let vw=1200, vh=700;
  const sync=()=>{ vw=innerWidth||document.documentElement.clientWidth||1200;
                   vh=innerHeight||document.documentElement.clientHeight||700; };
  sync();
  const AY = () => Math.round(vh*0.46);          // 轴线基准屏幕位置
  const LEFT = 120;
  const fitScale = () => (vw-LEFT*2)/SPAN;
  const maxScale = () => Math.max(420, vw*0.92);   // 最深可放大到「一天≈占满屏宽」
  let MIN_S=.2, MAX_S=maxScale();

  let s=1,sT=1, ox=0,oxT=0, oy=0,oyT=0;          // 缩放 + 二维偏移
  let hidden={}, selected=null;
  const dayOf=t=>(t-T0)/DAY;

  function clampX(v,sc){ const W=SPAN*sc, lo=LEFT-140, hi=LEFT+W-vw+140;
    return hi<lo ? LEFT+W/2-vw/2 : Math.max(lo,Math.min(hi,v)); }
  function clampY(v){
    let lo = -(vh-AY()-120), hi = AY()-90;        // 保证轴线不被拖出视野
    if (selected && cardH) hi = Math.max(hi, cardTop + cardH - (vh-AY()) + 40);
    return Math.max(lo, Math.min(hi, v));
  }

  /* ── 光点 ── */
  evs.forEach(e=>{
    const tp=TOPICS[e.topic], n=document.createElement('div');
    n.className='node'; n.style.setProperty('--c',tp.c);
    const marks = (e.img?.length?'🖼 ':'') + (e.discuss?`💬 ${e.discuss}`:'');
    n.innerHTML=`<div class="halo"></div><div class="ring"></div><div class="dot"></div><div class="hit"></div>
      <div class="lab"><span class="stem"></span><span class="d">${e.label}</span>
      <span class="t">${e.title}</span>${marks?`<span class="meta">${marks}</span>`:''}</div>`;
    const sz=7+e.w*2.2;
    n.querySelector('.dot').style.cssText+=`width:${sz}px;height:${sz}px`;
    n.querySelector('.halo').style.cssText+=`width:${sz*5}px;height:${sz*5}px;--dur:${5+(e._i%5)*.9}s;--delay:${(e._i%7)*.55}s`;
    n.querySelector('.ring').style.cssText+=`width:${sz*2.6}px;height:${sz*2.6}px`;
    layer.appendChild(n); n._ev=e;      // 反查：pointerup 时从 DOM 找回对应事件
    e._el=n; e._lab=n.querySelector('.lab'); e._stem=n.querySelector('.stem');
  });

  /* ── 详情卡 ── */
  const card=document.createElement('div'); card.id='card';
  card.innerHTML='<button class="cClose" id="cClose">✕</button><span class="stemUp"></span><div id="cardScroll"></div>';
  layer.appendChild(card);
  const cardScroll=$('cardScroll');
  let cardTop=0, cardH=0;
  card.addEventListener('pointerdown',e=>e.stopPropagation());   // 卡内不触发画布拖拽
  // 卡内滚轮必须截断，否则会冒泡到画布被 preventDefault 吃掉，导致卡片滚不动
  card.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
  $('cClose').onclick=()=>close();

  /* ── 图例 ── */
  const lgBox=$('legend');
  Object.entries(TOPICS).forEach(([k,v])=>{
    const d=document.createElement('div'); d.className='lg';
    d.innerHTML=`<span class="sw" style="--c:${v.c}"></span>${v.name}`;
    d.onclick=()=>{ hidden[k]=!hidden[k]; d.classList.toggle('off',!!hidden[k]); layout(); };
    lgBox.appendChild(d);
  });

  /* ── 底部导览 ── */
  evs.forEach(e=>{ const d=document.createElement('div'); d.className='mdot';
    d.style.setProperty('--c',TOPICS[e.topic].c);
    d.style.left=(dayOf(e._t)/SPAN*100)+'%'; mini.appendChild(d); });

  /* ── 刻度粒度 ── */
  const LEVELS=[{u:'day',n:1,d:1},{u:'day',n:7,d:7},{u:'month',n:1,d:30.44},
                {u:'month',n:3,d:91.3},{u:'year',n:1,d:365},{u:'year',n:5,d:1826}];
  const NAME={day:'日',month:'月',year:'年'};
  const pickLevel=sc=>LEVELS.find(L=>L.d*sc>=78)||LEVELS[LEVELS.length-1];
  function* steps(L,from,to){
    const d=new Date(from);
    if(L.u==='year'){ d.setMonth(0,1); d.setHours(0,0,0,0); d.setFullYear(Math.floor(d.getFullYear()/L.n)*L.n);
      while(d<=to){ yield new Date(d); d.setFullYear(d.getFullYear()+L.n);} }
    else if(L.u==='month'){ d.setDate(1); d.setHours(0,0,0,0); d.setMonth(Math.floor(d.getMonth()/L.n)*L.n);
      while(d<=to){ yield new Date(d); d.setMonth(d.getMonth()+L.n);} }
    else { d.setHours(0,0,0,0); while(d<=to){ yield new Date(d); d.setDate(d.getDate()+L.n);} }
  }
  const fmt=(dt,u)=> u==='year'?dt.getFullYear()+''
    : u==='month'?(dt.getMonth()===0?dt.getFullYear()+'年':(dt.getMonth()+1)+'月')
    : (dt.getMonth()+1)+'月'+dt.getDate()+'日';
  const rulePool=[], capPool=[], eraPool=[];
  function px(el,parent){ if(!el.parentNode) parent.appendChild(el); }

  function drawTicks(L){
    const t0=T0+((ox-LEFT)/s)*DAY-60*DAY, t1=T0+((ox-LEFT+vw)/s)*DAY+60*DAY;
    const rules=[], caps=[], eras=[];
    const yearPx=365*s;
    if(yearPx>=46 && L.u!=='year'){
      const st=yearPx>150?1:yearPx>74?2:5;
      for(const dt of steps({u:'year',n:st},t0,t1)) eras.push({t:dt.getTime(),cap:dt.getFullYear()+''});
    }
    for(const dt of steps(L,t0,t1)){
      rules.push({t:dt.getTime(),era:L.u==='year'});
      caps.push({t:dt.getTime(),cap:fmt(dt,L.u)});
      if(L.u==='year') eras.push({t:dt.getTime(),cap:dt.getFullYear()+''});
    }
    // 竖线（在 layer 内，随二维平移）
    while(rulePool.length<rules.length){ const d=document.createElement('div'); layer.appendChild(d); rulePool.push(d); }
    rulePool.forEach((el,i)=>{ const it=rules[i];
      if(!it){ el.style.display='none'; return; }
      el.style.display=''; el.className='tk'+(it.era?' era':'');
      el.style.cssText+=`left:${dayOf(it.t)*s+LEFT}px;top:${-vh*1.5}px;height:${vh*3}px`; });
    // 年份大字（layer 内，作背景层）
    while(eraPool.length<eras.length){ const d=document.createElement('div'); d.className='eraCap'; layer.appendChild(d); eraPool.push(d); }
    eraPool.forEach((el,i)=>{ const it=eras[i];
      if(!it){ el.style.display='none'; return; }
      el.style.display=''; el.textContent=it.cap;
      el.style.cssText+=`left:${dayOf(it.t)*s+LEFT}px;top:${-vh*0.30}px;font-size:${Math.min(52,Math.max(22,yearPx*.13))}px`; });
    // 底部时间尺（固定，只跟横向）
    while(capPool.length<caps.length){ const sp=document.createElement('span'); ruler.appendChild(sp); capPool.push(sp); }
    capPool.forEach((el,i)=>{ const it=caps[i];
      if(!it){ el.style.display='none'; return; }
      el.style.display=''; el.textContent=it.cap; el.style.left=(dayOf(it.t)*s+LEFT-ox)+'px'; });
  }

  /* ── 布局 ── */
  function layout(){
    sync();
    const ay=AY();
    axisLine.style.top=(ay-oy)+'px';
    layer.style.transform=`translate3d(${-ox}px,${ay-oy}px,0)`;

    const L=pickLevel(s);
    scaleTag.textContent=(L.n>1?L.n:'')+NAME[L.u];
    drawTicks(L);

    evs.forEach(e=>{
      const x=dayOf(e._t)*s+LEFT, el=e._el, off=!!hidden[e.topic];
      el.style.left=x+'px'; el.style.top='0px';
      el.style.display=off?'none':'';
      el.classList.toggle('dim',!!selected&&selected!==e&&!off);
      e._x=x;
    });

    // 标签：上下交替分层，横向不重叠且光点在屏内才显示
    const LW=190, LH=64, rows=[-1,1,-2,2,-3,3];
    const occ=new Map(rows.map(r=>[r,-1e9]));
    const vis=evs.filter(e=>!hidden[e.topic]).sort((a,b)=>a._x-b._x);
    vis.forEach(e=>{
      const lab=e._lab, sx=e._x-ox;
      if(sx<-10||sx>vw+10||(selected&&selected===e)){ lab.classList.remove('show'); return; }
      let r=null;
      for(const cand of rows) if(e._x-LW/2>occ.get(cand)+16){ occ.set(cand,e._x+LW/2); r=cand; break; }
      if(r===null){ lab.classList.remove('show'); return; }
      const up=r<0, dist=30+(Math.abs(r)-1)*(LH+12);
      lab.style.top = up ? -(dist+LH)+'px' : dist+'px';
      // 靠近屏幕边缘时把标签吸附回视野内，连接线仍指向光点
      const want=Math.max(LW/2+10, Math.min(vw-LW/2-10, sx)), shift=want-sx;
      lab.style.marginLeft=(-LW/2+shift)+'px';
      e._stem.style.cssText = (up
        ? `top:${LH}px;height:${dist-8}px;background:linear-gradient(var(--c),transparent)`
        : `bottom:100%;height:${dist-8}px;background:linear-gradient(transparent,var(--c))`)
        + `;left:calc(50% - ${shift}px)`;
      lab.classList.add('show');
    });

    if(selected){ card.style.left=selected._x+'px'; card.style.top=cardTop+'px'; }

    const W=SPAN*s;
    miniView.style.left=(Math.max(0,(ox-LEFT)/W)*100)+'%';
    miniView.style.width=Math.max(2,Math.min(100,vw/W*100))+'%';
  }

  /* ── 平滑循环 ── */
  let raf=null, still=0;
  function frame(){
    const ds=sT-s, dx=oxT-ox, dy=oyT-oy;
    if(Math.abs(ds)<1e-5&&Math.abs(dx)<.06&&Math.abs(dy)<.06){
      s=sT; ox=oxT; oy=oyT; layout();
      if(++still>4){ raf=null; return; }
    } else still=0;
    s+=ds*.16; ox+=dx*.19; oy+=dy*.19;
    layout(); raf=requestAnimationFrame(frame);
  }
  const kick=()=>{ still=0; if(!raf) raf=requestAnimationFrame(frame); };

  /* ── 交互：二维自由拖拽 ── */
  function zoomAt(f,ax){
    sync(); MAX_S=maxScale(); MIN_S=Math.min(fitScale(),MAX_S);
    const ns=Math.max(MIN_S,Math.min(MAX_S,sT*f)); if(ns===sT) return;
    const at=(ax+oxT-LEFT)/sT; sT=ns; oxT=clampX(at*sT-ax+LEFT,sT); kick();
  }
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*.0125),e.clientX);
    else if(e.shiftKey) { oxT=clampX(oxT+e.deltaY*1.1,sT); kick(); }
    else { oxT=clampX(oxT+e.deltaX*1.1,sT); oyT=clampY(oyT+e.deltaY*1.1); kick(); }
    dismiss();
  },{passive:false});

  let drag=null,moved=0,downEl=null;
  stage.addEventListener('pointerdown',e=>{
    moved=0; downEl=e.target;      // 记下按下的元素，松手时据此判定
    drag={x:e.clientX,y:e.clientY,ox:oxT,oy:oyT,m:0};
    stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.m=Math.max(drag.m,Math.abs(dx)+Math.abs(dy));
    oxT=ox=clampX(drag.ox-dx,sT); oyT=oy=clampY(drag.oy-dy);
    layout(); dismiss();
  });
  const endDrag=()=>{ moved=drag?drag.m:0; drag=null; stage.classList.remove('dragging'); };
  // 关键：setPointerCapture 会把 pointerup 锁到画布上，浏览器算出的 click 目标随之变成画布，
  // 元素自身的 click 处理器永远不触发。所以点击判定必须放在 pointerup，而不是依赖 click 事件。
  stage.addEventListener('pointerup',e=>{
    const m=drag?drag.m:0;
    endDrag();
    if(m>8) return;                                   // 位移够大＝拖拽，不是点击
    if(downEl&&downEl.closest('#card')) return;        // 卡内交互由卡片自己处理
    const nodeEl=downEl&&downEl.closest('.node');
    if(nodeEl&&nodeEl._ev){ open(nodeEl._ev); return; }
    close();
  });
  stage.addEventListener('pointercancel',endDrag);

  let pinch=null;
  stage.addEventListener('touchstart',e=>{ if(e.touches.length===2){
    const[a,b]=e.touches; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:sT};
    drag=null; stage.classList.remove('dragging'); } },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(pinch&&e.touches.length===2){ e.preventDefault();
      const[a,b]=e.touches, d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), mid=(a.clientX+b.clientX)/2;
      const ns=Math.max(MIN_S,Math.min(MAX_S,pinch.s*(d/pinch.d)));
      const at=(mid+oxT-LEFT)/sT; sT=ns; oxT=clampX(at*sT-mid+LEFT,sT); kick(); dismiss(); }
  },{passive:false});
  stage.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; },{passive:true});

  $('zin').onclick=()=>zoomAt(1.6,vw/2);
  $('zout').onclick=()=>zoomAt(1/1.6,vw/2);

  /* ── 范围预设 ── */
  const rbs=[...document.querySelectorAll('#ranges button')];
  function setRange(y,mark){
    sync(); MAX_S=maxScale(); MIN_S=Math.min(fitScale(),MAX_S);
    if(y===0){ sT=MIN_S; oxT=clampX(LEFT+SPAN*sT/2-vw/2,sT); }
    else { sT=Math.max(MIN_S,Math.min(MAX_S,(vw-260)/(y*365)));
           oxT=clampX(dayOf(evs[evs.length-1]._t)*sT+LEFT-vw*.72,sT); }
    oyT=clampY(0);
    rbs.forEach(b=>b.classList.toggle('on',b===mark)); kick(); dismiss();
  }
  rbs.forEach(b=>b.onclick=()=>setRange(+b.dataset.r,b));
  mini.addEventListener('pointerdown',e=>{
    const r=mini.getBoundingClientRect(), p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    oxT=clampX(p*SPAN*sT+LEFT-vw/2,sT); kick(); dismiss();
  });

  /* ── 详情：从光点向下展开 ── */
  function open(e){
    selected=e; evs.forEach(x=>x._el.classList.toggle('sel',x===e));
    const tp=TOPICS[e.topic];
    cardScroll.innerHTML=buildCardHTML(e);
    hydrate(cardScroll); setHash(e);
    card.style.setProperty('--c',tp.c);
    cardTop=34;
    card.classList.remove('on'); void card.offsetWidth; card.classList.add('on');
    requestAnimationFrame(()=>{ cardH=card.offsetHeight||420;
      oxT=clampX(dayOf(e._t)*sT+LEFT-vw*.42,sT);
      oyT=clampY(AY()-vh*.30);
      kick(); });
    // rAF 被节流时的兜底
    cardH=card.offsetHeight||420;
    oxT=clampX(dayOf(e._t)*sT+LEFT-vw*.42,sT); oyT=clampY(AY()-vh*.30);
    kick(); layout(); dismiss();
  }
  function close(){ selected=null; card.classList.remove('on');
    evs.forEach(x=>x._el.classList.remove('sel')); layout(); setHash(null); }
  window.gotoEvent = e => { if (e && e._el) open(e); };   // 供议题脉络／人物档案跳转
  /* 开关卡片统一由上面的 pointerup 处理，这里不再监听 click */
  addEventListener('keydown',e=>{
    if(e.key==='Escape') close();
    if(e.key==='+'||e.key==='=') zoomAt(1.4,vw/2);
    if(e.key==='-'||e.key==='_') zoomAt(1/1.4,vw/2);
    if(e.key==='ArrowRight'){ oxT=clampX(oxT+120,sT); kick(); }
    if(e.key==='ArrowLeft'){ oxT=clampX(oxT-120,sT); kick(); }
    if(e.key==='ArrowDown'){ oyT=clampY(oyT+100); kick(); }
    if(e.key==='ArrowUp'){ oyT=clampY(oyT-100); kick(); }
  });

  /* ── 主题 ── */
  const root=document.documentElement;
  const getT=()=>{ try{return localStorage.getItem('faham-theme')}catch(_){return null} };
  const setT=v=>{ try{localStorage.setItem('faham-theme',v)}catch(_){} };
  root.setAttribute('data-theme', getT() || 'light');   // 默认「档案馆」明亮
  $('theme').onclick=()=>{ const n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n); setT(n); };

  let gone=false; const dismiss=()=>{ if(!gone){gone=true; hint.classList.add('gone');} };
  setTimeout(dismiss,9000);

  function resize(){ sync(); MAX_S=maxScale(); MIN_S=Math.min(fitScale(),MAX_S);
    sT=Math.max(MIN_S,Math.min(MAX_S,sT)); oxT=clampX(oxT,sT); oyT=clampY(oyT); layout(); }
  addEventListener('resize',()=>{resize();kick();});
  if(window.visualViewport) visualViewport.addEventListener('resize',()=>{resize();kick();});

  function start(){ setRange(2,rbs[2]); s=sT; ox=oxT; oy=oyT; layout(); }
  sync(); MAX_S=maxScale(); MIN_S=Math.min(fitScale(),MAX_S); start();
  requestAnimationFrame(start); addEventListener('load',start);
  applyHash();
}

/* ═══════════ 竖向引擎（手机）═══════════
   原生滚动的时间线，从上到下按时间排列 —— 顺着手机的方向，不做自定义缩放/拖拽。 */
function bootVertical() {
  document.body.classList.add('vmode');
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const evs = EVENTS.slice().sort((a,b)=> new Date(b.date) - new Date(a.date)); // 新→旧
  const hidden = {};

  // 议题过滤条
  const vf = $('vfilter');
  vf.innerHTML = Object.entries(TOPICS).map(([k,v])=>
    `<div class="chip" data-k="${k}" style="--c:${v.c}"><span class="sw"></span>${v.name}</div>`).join('');
  vf.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',()=>{ const k=c.dataset.k; hidden[k]=!hidden[k];
      c.classList.toggle('off',!!hidden[k]); render(); });
  });

  const tl = $('vtl');
  const MON = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  // 精确到日的显示；数据只到年/月时按精度回退，不假装知道具体哪天
  function dayLabel(e){
    const [y,m,d] = e.date.split('-');
    if (e.label && /日/.test(e.label)) return e.label;         // 原始标签已到日，直接用
    if (e.label && /[–—~]/.test(e.label)) return e.label;      // 跨期事件（如 2020–2022年）
    if (d && d !== '01') return `${+m}月${+d}日`;
    if (e.label && /月/.test(e.label)) return e.label;
    return e.label || `${y}年`;
  }
  function render(){
    const list = evs.filter(e=>!hidden[e.topic]);
    let html='', lastYear=null, lastMon=null;
    list.forEach(e=>{
      const yr = e.date.slice(0,4), mo = e.date.slice(5,7);
      if(yr!==lastYear){ html+=`<div class="vyear">${yr}</div>`; lastYear=yr; lastMon=null; }
      if(mo!==lastMon){ html+=`<div class="vmonth">${MON[+mo-1]}</div>`; lastMon=mo; }
      const tp = TOPICS[e.topic], sl = sourceLevel(e);
      const marks = (e.img?.length?'🖼 ':'') + (e.discuss?`💬 ${e.discuss}`:'');
      html += `<div class="vitem" data-i="${e._vi}" style="--c:${tp.c}">
        <div class="vdot"></div>
        <button class="vrow" type="button">
          <span class="vd">${esc(dayLabel(e))}</span>
          <span class="vt">${esc(e.title)}</span>
          <span class="vmeta"><span class="vtag">${esc(tp.name)}</span>${srcBadge(sl)}${e.who?`<span>${esc(e.who)}</span>`:''}${marks?`<span>${marks}</span>`:''}</span>
        </button>
        <div class="vcard"><div class="vcard-inner"></div></div>
      </div>`;
    });
    tl.innerHTML = html || '<div class="vyear" style="padding-left:16px">无符合条件的事件</div>';
    tl.querySelectorAll('.vitem').forEach(it=>{
      const e = EVENTS[+it.dataset.i];
      it.querySelector('.vrow').addEventListener('click',()=>{
        const open = it.classList.contains('open');
        if(!open){
          const inner = it.querySelector('.vcard-inner');
          if(!inner.dataset.built){
            inner.innerHTML = buildCardTabsHTML(e, it.dataset.i);   // 手机用页签版
            inner.dataset.built='1';
            hydrate(inner);
          }
        }
        it.classList.toggle('open');
        setHash(it.classList.contains('open') ? e : null);
      });
    });
  }

  // 跨事件跳转：目标可能被议题过滤挡住，先取消过滤再展开
  window.gotoEvent = e => {
    const i = EVENTS.indexOf(e);
    if (hidden[e.topic]) {
      hidden[e.topic] = false;
      vf.querySelector(`.chip[data-k="${e.topic}"]`)?.classList.remove('off');
      render();
    }
    const it = tl.querySelector(`.vitem[data-i="${i}"]`);
    if (!it) return;
    if (!it.classList.contains('open')) it.querySelector('.vrow').click();
    it.scrollIntoView({ behavior:'smooth', block:'start' });
  };
  EVENTS.forEach((e,i)=>{ const t=evs.indexOf(e); }); // no-op guard
  evs.forEach(e=>{ e._vi = EVENTS.indexOf(e); });
  render();
  applyHash();

  // 主题切换（与桌面共用同一存储键）
  const root=document.documentElement;
  $('vtheme').addEventListener('click',()=>{
    const n = root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);
    try{ localStorage.setItem('faham-theme',n); }catch(_){}
  });
}

/* 载入数据后启动；无数据时显示空状态而非白屏。
   优先尝试本地测试数据 events.local.json（被 .gitignore 忽略，永不进仓库）；
   不存在时回退到 events.json（仓库中为空数组）。 */
async function loadEvents() {
  for (const url of ['./data/events.local.json', './data/events.json']) {
    try {
      const r = await fetch(url);
      if (r.ok) { const rows = await r.json(); if (Array.isArray(rows)) return rows; }
    } catch (_) { /* 本地文件不存在或 file:// 限制，继续 */ }
  }
  return [];
}
/* 议题脉络与人物索引是可选的旁挂数据：文件不存在时相关分段自动不渲染，
   不影响其余功能。 */
async function loadSide(url, pick){
  try {
    const r = await fetch(url);
    if (!r.ok) return [];
    const d = await r.json();
    return pick(d) || [];
  } catch (_) { return []; }
}

const NARROW = () => matchMedia('(max-width: 700px)').matches;

Promise.all([
  loadEvents(),
  loadSide('./data/threads.json', d => d.threads),
  loadSide('./data/actors.json',  d => d.actors)
]).then(([rows, threads, actors]) => {
  EVENTS  = Array.isArray(rows) ? rows : [];
  THREADS = (threads||[]).filter(t => Array.isArray(t.events) && t.events.length > 1);
  ACTORS  = actors || [];

  wireSubmit();      // 投稿入口与数据无关：空档案时它反而是唯一的入口

  const emptyEl = document.getElementById('empty');
  if (!EVENTS.length) {
    emptyEl.hidden = false;
    document.getElementById('bar').style.opacity = '.45';
    return;
  }
  emptyEl.hidden = true;      // 有数据：务必收起空状态遮罩
  if (NARROW()) bootVertical(); else boot();
});

// 跨越窄/宽阈值时（如横竖屏切换）重载，让布局引擎重新选择——比双引擎共存更稳
let _wasNarrow = NARROW();
addEventListener('resize', () => {
  const now = NARROW();
  if (now !== _wasNarrow) { _wasNarrow = now; location.reload(); }
});
</script>
